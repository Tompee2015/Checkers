<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draughts Online</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
  h1 { margin-bottom: 10px; font-size: 1.3rem; }
  .lobby { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
  .lobby button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  .btn-qm { background: #4ecdc4; color: #000; }
  .btn-create { background: #45b7d1; color: #000; }
  .btn-join { background: #ff6b6b; color: #fff; }
  .lobby input { padding: 8px; border-radius: 4px; border: none; width: 80px; text-transform: uppercase; }
  #status { margin-bottom: 10px; font-size: 0.85rem; color: #aaa; min-height: 1.2em; text-align: center; }
  .game-area { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  #board { display: grid; grid-template-columns: repeat(8, min(52px, 10vw)); grid-template-rows: repeat(8, min(52px, 10vw)); border: 3px solid #333; }
  .sq { display: flex; align-items: center; justify-content: center; cursor: pointer; aspect-ratio: 1; }
  .sq.light { background: #f0d9b5; }
  .sq.dark { background: #b58863; }
  .sq.selected { outline: 3px solid #4ecdc4; outline-offset: -3px; }
  .sq.valid { position: relative; }
  .sq.valid::after { content: ''; width: 12px; height: 12px; background: rgba(78,205,196,0.6); border-radius: 50%; position: absolute; }
  .piece { width: 75%; height: 75%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; }
  .piece.w { background: #fff; border: 2px solid #ccc; color: #333; }
  .piece.b { background: #222; border: 2px solid #555; color: #eee; }
  .piece.k::after { content: '♛'; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .actions button { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  #rematch { background: #4ecdc4; color: #000; display: none; }
  /* Chat */
  #chat-box { width: 200px; background: #16213e; border-radius: 8px; padding: 10px; display: none; flex-direction: column; }
  #chat-box h3 { font-size: 0.8rem; color: #888; margin-bottom: 6px; }
  #chat-msgs { flex: 1; height: 180px; overflow-y: auto; font-size: 0.8rem; margin-bottom: 8px; }
  #chat-msgs .msg { margin-bottom: 4px; }
  #chat-msgs .msg .who { color: #4ecdc4; font-weight: 600; }
  #chat-input-row { display: flex; gap: 4px; }
  #chat-input { flex: 1; padding: 6px; border: none; border-radius: 4px; background: #0f3460; color: #eee; font-size: 0.8rem; }
  #chat-send { padding: 6px 10px; border: none; border-radius: 4px; background: #4ecdc4; color: #000; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<h1>♟ Draughts Online</h1>
<div class="lobby">
  <button class="btn-qm" onclick="quickMatch()">⚡ Quick Match</button>
  <button class="btn-create" onclick="createRoom()">Create</button>
  <input id="roomCode" placeholder="CODE" maxlength="4">
  <button class="btn-join" onclick="joinRoom()">Join</button>
</div>
<div id="status">Press Quick Match or Create to start.</div>

<div class="game-area">
  <div>
    <div id="board"></div>
    <div class="actions">
      <button id="rematch" onclick="rematch()">Rematch</button>
    </div>
  </div>
  <div id="chat-box">
    <h3>💬 Chat</h3>
    <div id="chat-msgs"></div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="Say hi..." maxlength="100">
      <button id="chat-send" onclick="sendChat()">→</button>
    </div>
  </div>
</div>

<script>
let ws, mySide = null, board = null, selected = null, validMoves = [], gameOver = false;

function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => setStatus('Disconnected. Refresh to reconnect.');
}
function send(obj) { if (ws) ws.send(JSON.stringify(obj)); }
function quickMatch() { send({ type: 'quickmatch' }); }
function createRoom() { send({ type: 'create' }); }
function joinRoom() { const c = document.getElementById('roomCode').value.trim(); if (c) send({ type: 'join', room: c }); }
function rematch() { send({ type: 'rematch' }); document.getElementById('rematch').style.display = 'none'; }

// --- CHAT ---
function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  send({ type: 'chat', text });
  input.value = '';
}
document.getElementById('chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

function addChat(who, text) {
  const el = document.getElementById('chat-msgs');
  el.innerHTML += `<div class="msg"><span class="who">${who}:</span> ${text}</div>`;
  el.scrollTop = el.scrollHeight;
}

// --- HANDLERS ---
function handle(msg) {
  if (msg.type === 'queued') setStatus(`In queue... position #${msg.position}`);
  if (msg.type === 'leftqueue') setStatus('Left queue.');
  if (msg.type === 'joined') {
    mySide = msg.side; board = msg.board; gameOver = false;
    document.getElementById('roomCode').value = msg.room;
    document.getElementById('chat-box').style.display = 'flex';
    setStatus(`You are ${mySide === 'w' ? '⚪ White' : '⚫ Black'}. Room: ${msg.room}`);
    render();
  }
  if (msg.type === 'opponent_joined') setStatus('Opponent found! ' + (mySide === 'w' ? 'Your turn' : 'Waiting for White...'));
  if (msg.type === 'opponent_left') { setStatus('Opponent left.'); gameOver = true; render(); }
  if (msg.type === 'error') setStatus(msg.msg);
  if (msg.type === 'chat') addChat(msg.from, msg.text);
  if (msg.type === 'state') {
    board = msg.board; selected = null; validMoves = [];
    gameOver = msg.over;
    if (gameOver) {
      setStatus(`🏆 ${msg.winner === 'w' ? 'White' : 'Black'} wins!`);
      document.getElementById('rematch').style.display = 'inline-block';
    } else {
      setStatus(msg.turn === mySide ? 'Your turn!' : 'Waiting for opponent...');
    }
    render();
  }
}

function setStatus(t) { document.getElementById('status').textContent = t; }

function getValidMoves(r, c) {
  const piece = board[r][c];
  if (!piece) return [];
  const isKing = piece.length === 2;
  const dirs = [];
  if (piece[0] === 'w') dirs.push(-1); else dirs.push(1);
  if (isKing) dirs.push(...(dirs.includes(-1) ? [1] : [-1]));
  const moves = [];
  for (const dr of [...new Set(dirs)])
    for (const dc of [-1, 1]) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr > 7 || nc < 0 || nc > 7) continue;
      if (!board[nr][nc]) moves.push({ to: [nr, nc] });
      else if (board[nr][nc][0] !== piece[0]) {
        const jr = nr + dr, jc = nc + dc;
        if (jr >= 0 && jr <= 7 && jc >= 0 && jc <= 7 && !board[jr][jc]) moves.push({ to: [jr, jc] });
      }
    }
  return moves;
}

function onSquareClick(r, c) {
  if (gameOver || !board) return;
  if (selected) {
    const move = validMoves.find(m => m.to[0] === r && m.to[1] === c);
    if (move) { send({ type: 'move', r: selected[0], c: selected[1], to: [r, c] }); selected = null; validMoves = []; return; }
  }
  if (board[r][c] && board[r][c][0] === mySide[0]) {
    selected = [r, c];
    validMoves = getValidMoves(r, c);
  } else { selected = null; validMoves = []; }
  render();
}

function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      sq.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      if (selected && selected[0] === r && selected[1] === c) sq.classList.add('selected');
      if (validMoves.some(m => m.to[0] === r && m.to[1] === c)) sq.classList.add('valid');
      if (board && board[r][c]) {
        const p = document.createElement('div');
        p.className = 'piece ' + board[r][c][0] + (board[r][c].length === 2 ? ' k' : '');
        sq.appendChild(p);
      }
      sq.onclick = () => onSquareClick(r, c);
      el.appendChild(sq);
    }
}

connect();
</script>
</body>
</html>
