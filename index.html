<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draughts Online (10x10 & 8x8)</title>
  <style>
    :root {
      --bg: #12161f;
      --panel: #1c2230;
      --accent: #f59e0b;
      --light-sq: #e8d5b5;
      --dark-sq: #6b4423;
      --text: #f3f4f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
    h1 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent); }
    .ad-slot { width: 100%; max-width: 728px; min-height: 50px; background: #181d28; border: 1px dashed #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.75rem; margin: 8px 0; }
    .settings-bar { background: var(--panel); padding: 8px 14px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; margin-bottom: 10px; font-size: 0.9rem; }
    .settings-bar select { padding: 6px 8px; border-radius: 5px; background: #0f172a; color: #fff; border: 1px solid #334155; cursor: pointer; }
    .settings-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
    button { background: var(--accent); color: #111; border: none; padding: 9px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.15s; }
    button:hover { opacity: 0.9; }
    button.secondary { background: #334155; color: #fff; }
    #room-input { padding: 9px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; width: 120px; text-transform: uppercase; }
    #status { background: var(--panel); padding: 8px 16px; border-radius: 20px; font-size: 0.95rem; margin-bottom: 12px; text-align: center; }
    .main-layout { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; width: 100%; max-width: 960px; }
    #board { display: grid; grid-template-columns: repeat(10, 1fr); width: min(92vw, 480px); height: min(92vw, 480px); border: 4px solid #3d2511; border-radius: 4px; overflow: hidden; }
    .sq { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
    .sq.light { background: var(--light-sq); }
    .sq.dark { background: var(--dark-sq); }
    .sq.highlight::after { content: ''; width: 32%; height: 32%; background: rgba(34, 197, 94, 0.85); border-radius: 50%; }
    .piece { width: 78%; height: 78%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.5); transition: transform 0.1s; }
    .piece.white { background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1); border: 2px solid #94a3b8; color: #1e293b; }
    .piece.black { background: radial-gradient(circle at 30% 30%, #334155, #090d16); border: 2px solid #475569; color: #fbbf24; }
    .piece.selected { outline: 3px solid #22c55e; transform: scale(1.08); }
    .piece.king::after { content: '♛'; font-size: 1.2rem; }
    .chat-box { background: var(--panel); width: min(92vw, 320px); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; height: 480px; }
    .chat-box h3 { font-size: 1rem; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    #messages { flex: 1; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .msg { background: #0f172a; padding: 6px 8px; border-radius: 6px; word-break: break-word; }
    .chat-input { display: flex; gap: 6px; }
    .chat-input input { flex: 1; padding: 9px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; }
  </style>
</head>
<body>
  <h1>♟ Draughts Online</h1>

  <div id="ad-banner-top" class="ad-slot">Ad Space Ready (728x90)</div>

  <div class="settings-bar">
    <label>Board Size:
      <select id="opt-size">
        <option value="10" selected>10×10 (International / Ghana)</option>
        <option value="8">8×8 (Classic)</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="opt-mandatory" checked />
      Mandatory Capture
    </label>
  </div>
  <div class="controls" style="background: var(--panel); padding: 8px 14px; border-radius: 8px;">
    <label>Board:
      <select id="opt-size" style="padding: 6px; border-radius: 5px; background: #0f172a; color: #fff; border: 1px solid #334155;">
        <option value="10" selected>10×10 (International/Ghana)</option>
        <option value="8">8×8 (Classic)</option>
      </select>
    </label>
    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
      <input type="checkbox" id="opt-mandatory" checked style="width: auto;" />
      Mandatory Capture
    </label>
  </div>
  <div class="controls">
    <button id="btn-ai">🤖 Play vs Computer</button>
    <button id="btn-quick">⚡ Quick Match</button>
    <button id="btn-create" class="secondary">➕ Create Room</button>
    <input id="room-input" placeholder="ROOM CODE" maxlength="5" />
    <button id="btn-join" class="secondary">Join</button>
    <button id="btn-rematch" class="secondary" style="display:none;">🔄 Rematch</button>
  </div>

  <div id="status">Choose <b>Play vs Computer</b>, <b>Quick Match</b>, or <b>Create Room</b>!</div>

  <div class="main-layout">
    <div id="board"></div>

    <div class="chat-box">
      <h3>💬 Live Chat</h3>
      <div id="messages"></div>
      <div class="chat-input">
        <input id="chat-msg" placeholder="Say something..." maxlength="200" />
        <button id="btn-send">Send</button>
      </div>
    </div>
  </div>

  <div id="ad-banner-bottom" class="ad-slot">Ad Space Ready (Responsive)</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const DIRS = [
      { dr: -1, dc: -1 },
      { dr: -1, dc: 1 },
      { dr: 1, dc: -1 },
      { dr: 1, dc: 1 }
    ];

    let SIZE = 10;
    let mandatoryCapture = true;
    let board = [];
    let turn = 'white';
    let myColor = 'white';
    let mode = null;
    let gameActive = false;
    let selected = null;
    let validMoves = [];
    let mustContinueFrom = null;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const rematchBtn = document.getElementById('btn-rematch');
    const sizeSelect = document.getElementById('opt-size');
    const mandatoryCheckbox = document.getElementById('opt-mandatory');

    function initBoard() {
      boardEl.style.gridTemplateColumns = 'repeat(' + SIZE + ', 1fr)';
      const pieceRows = SIZE === 10 ? 4 : 3;
      board = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          if ((r + c) % 2 === 1) {
            if (r < pieceRows) row.push({ color: 'black', king: false });
            else if (r >= SIZE - pieceRows) row.push({ color: 'white', king: false });
            else row.push(null);
          } else {
            row.push(null);
          }
        }
        board.push(row);
      }
      turn = 'white';
      selected = null;
      validMoves = [];
      mustContinueFrom = null;
      gameActive = true;
      rematchBtn.style.display = 'inline-block';
      render();
    }

    function inBounds(r, c) {
      return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
    }

    function getPieceMoves(r, c) {
      const p = board[r][c];
      if (!p) return [];
      const captures = [];
      const steps = [];

      if (!p.king) {
        const forwardDirs = p.color === 'white'
          ? [{ dr: -1, dc: -1 }, { dr: -1, dc: 1 }]
          : [{ dr: 1, dc: -1 }, { dr: 1, dc: 1 }];

        for (const d of forwardDirs) {
          const nr = r + d.dr, nc = c + d.dc;
          if (inBounds(nr, nc) && !board[nr][nc]) {
            steps.push({ fromR: r, fromC: c, toR: nr, toC: nc, capR: null, capC: null });
          }
        }
        for (const d of DIRS) {
          const mr = r + d.dr, mc = c + d.dc;
          const lr = r + d.dr * 2, lc = c + d.dc * 2;
          if (inBounds(lr, lc) && board[mr][mc] && board[mr][mc].color !== p.color && !board[lr][lc]) {
            captures.push({ fromR: r, fromC: c, toR: lr, toC: lc, capR: mr, capC: mc });
          }
        }
      } else {
        for (const d of DIRS) {
          let nr = r + d.dr, nc = c + d.dc;
          let enemyR = null, enemyC = null;
          while (inBounds(nr, nc)) {
            const cell = board[nr][nc];
            if (!cell) {
              if (enemyR === null) {
                steps.push({ fromR: r, fromC: c, toR: nr, toC: nc, capR: null, capC: null });
              } else {
                captures.push({ fromR: r, fromC: c, toR: nr, toC: nc, capR: enemyR, capC: enemyC });
              }
            } else if (cell.color === p.color) {
              break;
            } else {
              if (enemyR !== null) break;
              enemyR = nr;
              enemyC = nc;
            }
            nr += d.dr;
            nc += d.dc;
          }
        }
      }
      return (mandatoryCapture && captures.length > 0) ? captures : captures.concat(steps);
    }

    function getAllMoves(color) {
      let allCaptures = [];
      let allSteps = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] && board[r][c].color === color) {
            const moves = getPieceMoves(r, c);
            for (const m of moves) {
              if (m.capR !== null) allCaptures.push(m);
              else allSteps.push(m);
            }
          }
        }
      }
      return (mandatoryCapture && allCaptures.length > 0) ? allCaptures : allCaptures.concat(allSteps);
    }

    function applyMove(move, isRemote) {
      const piece = board[move.fromR][move.fromC];
      board[move.toR][move.toC] = piece;
      board[move.fromR][move.fromC] = null;

      if (move.capR !== null) {
        board[move.capR][move.capC] = null;
      }

      let canJumpAgain = false;
      if (move.capR !== null) {
        const nextMoves = getPieceMoves(move.toR, move.toC).filter(m => m.capR !== null);
        if (nextMoves.length > 0) {
          canJumpAgain = true;
          mustContinueFrom = { r: move.toR, c: move.toC };
